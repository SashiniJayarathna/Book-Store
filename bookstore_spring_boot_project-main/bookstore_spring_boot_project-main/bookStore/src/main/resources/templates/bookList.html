<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.com">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/0faddc1af8.js" crossorigin="anonymous"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <title>Available Books</title>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f6f9;
        }

        .page-title {
            font-weight: 600;
        }

        .table-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,.08);
            padding: 25px;
        }

        table thead {
            background-color: #212529;
            color: white;
        }

        table tbody tr:hover {
            background-color: #f1f5ff;
        }

        .action-icons i {
            cursor: pointer;
            font-size: 1rem;
        }

        .action-icons a {
            vertical-align: middle;
        }
		
		html, body {
		    height: 100%;
		    margin: 0;
		    display: flex;
		    flex-direction: column;
		}

		.page-container {
		    flex: 1;              /* Take up all remaining space */
		    display: flex;
		    flex-direction: column;
		}

		.content-wrap {
		    flex: 1;              /* Push footer to bottom if content is short */
		}
		
		.btn-yellow {
		    background-color: #ffc107;  /* yellow */
		    color: #000;                /* black text */
		    font-weight: 600;
		}

		.btn-yellow:hover {
		    background-color: #e6ac00;  /* darker yellow on hover */
		    color: #000;
		}


    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"> Book Store</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="available_books">Available Books</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="my_books">My Books</a>
                </li>
            </ul>

            <a class="btn btn-warning fw-semibold" href="book_register">
                + New Book Register
            </a>
        </div>
    </div>
</nav>
<div class="content-wrap">
<!-- CONTENT -->
<div class="container my-5">

    <!-- TITLE -->
    <div class="text-center mb-4">
        <h2 class="page-title"> Available Books</h2>
        <p class="text-muted">Manage and explore all available books</p>
    </div>

    <!-- TABLE CARD -->
    <div class="table-card">

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Id</th>
                    <th>Book Name</th>
                    <th>Author</th>
                    <th>Price</th>
                    <th>Image</th>
                    <th class="text-center">Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="b : ${book}">
                    <td th:text="${b.id}"></td>
                    <td th:text="${b.name}"></td>
                    <td th:text="${b.author}"></td>
                    <td>Rs. <span th:text="${b.price}"></span></td>

                    <!-- Image Column -->
                    <td class="text-center">
                        <img th:src="@{'/images/' + ${b.imageName}}"
                             width="60" height="80" style="object-fit:cover; border-radius:4px;">
                    </td>

                    <!-- Actions Column -->
                    <td class="text-center action-icons">
                        <a class="btn btn-sm btn-yellow"
                           th:href="@{/mylist/{id}(id=${b.id})}">
                            <i class="fa-solid fa-bookmark"></i> Add
                        </a>

                        <a class="ms-2 text-warning"
                           th:href="@{/editBook/{id}(id=${b.id})}" title="Edit Book">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </a>

                        <a class="ms-2 text-danger"
                           th:href="@{/deleteBook/{id}(id=${b.id})}" title="Delete Book">
                            <i class="fa-solid fa-trash"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>
</div>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-3">
    © 2026 Book Store | All Rights Reserved
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

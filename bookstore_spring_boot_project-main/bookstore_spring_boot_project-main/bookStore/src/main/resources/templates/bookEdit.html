<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.com">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <title>Edit Book</title>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f6f9;
        }

        .form-card {
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,.1);
            padding: 35px;
        }

        .page-title {
            font-weight: 600;
        }

        label {
            font-weight: 500;
        }
		.btn-yellow {
			    background-color: #ffc107; /* yellow */
			    color: #000;               /* black text */
			    font-weight: 600;
			}

			.btn-yellow:hover {
			    background-color: #e6ac00; /* darker yellow on hover */
			    color: #000;
			}
			html, body {
				    height: 100%;
				    margin: 0;
				    display: flex;
				    flex-direction: column;
				}

				.page-container {
				    flex: 1;              /* Take up all remaining space */
				    display: flex;
				    flex-direction: column;
				}

				.content-wrap {
				    flex: 1;              /* Push footer to bottom if content is short */
				}
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"> Book Store</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/available_books}">Available Books</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/my_books}">My Books</a>
                </li>
            </ul>

			<a class="btn btn-warning fw-semibold"
			   th:href="@{/book_register}">
			   + New Book Register
			</a>
        </div>
    </div>
</nav>
<div class="content-wrap">
<!-- FORM -->
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">

            <div class="form-card">
                <h3 class="text-center page-title mb-4"> Edit Book</h3>

                <form th:action="@{/save}" method="post" th:object="${book}" enctype="multipart/form-data">

                    <!-- Hidden ID -->
                    <input type="hidden" name="id" th:value="${book.id}" />

                    <div class="mb-3">
                        <label class="form-label">Book Name</label>
                        <input type="text" class="form-control"
                               name="name" th:value="${book.name}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Author</label>
                        <input type="text" class="form-control"
                               name="author" th:value="${book.author}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Price</label>
                        <input type="number" class="form-control"
                               name="price" th:value="${book.price}" required>
                    </div>

                    <!-- Optional: Update Book Image -->
                    <div class="mb-3">
                        <label class="form-label">Book Image</label>
                        <input type="file" class="form-control" name="imageFile">
                        <small class="text-muted">Leave blank to keep existing image</small>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-yellow btn-lg">
                            Update Book
                        </button>
                    </div>

                </form>
            </div>

        </div>
    </div>
</div>
</div>
<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-3">
    © 2026 Book Store | All Rights Reserved
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

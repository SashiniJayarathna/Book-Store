<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.com">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/0faddc1af8.js" crossorigin="anonymous"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <title>My Books</title>

    <style>
		
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f6f9;
			
        }

        .page-title {
            font-weight: 600;
        }

        .table-card {
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,.08);
            padding: 25px;
        }

        table thead {
            background-color: #212529;
            color: #ffffff;
        }

        table tbody tr:hover {
            background-color: #f1f5ff;
        }

        .delete-icon {
            transition: all 0.2s ease-in-out;
        }

        .delete-icon:hover {
            color: darkred !important;
            transform: scale(1.2);
        }

        .book-thumb {
            width: 60px;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
        }
		
		html, body {
		    height: 100%;
		    margin: 0;
		    display: flex;
		    flex-direction: column;
		}

		.page-container {
		    flex: 1;              /* Take up all remaining space */
		    display: flex;
		    flex-direction: column;
		}

		.content-wrap {
		    flex: 1;              /* Push footer to bottom if content is short */
		}


    </style>
</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"> Book Store</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="available_books">Available Books</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="my_books">My Books</a>
                </li>
            </ul>

            <a class="btn btn-warning fw-semibold" href="book_register">
                + New Book Register
            </a>
        </div>
    </div>
</nav>
<div class="content-wrap">
<!-- CONTENT -->
<div class="container my-5 col-md-10">

    <!-- TITLE -->
    <div class="text-center mb-4">
        <h2 class="page-title"> My Book Collection</h2>
        <p class="text-muted">Books you have added to your personal list</p>
    </div>

    <!-- TABLE CARD -->
    <div class="table-card">

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>No</th>
                    <th>Cover</th>
                    <th>Book Name</th>
                    <th>Author</th>
                    <th>Price</th>
                    <th class="text-center">Action</th>
                </tr>
                </thead>

                <tbody>
                <!-- LOOP THROUGH BOOKS -->
                <tr th:each="b : ${books}">
                    <td th:text="${b.id}"></td>
                    <td>
                        <img th:src="@{'/images/' + ${b.imageName}}" 
                             alt="Book Cover" class="book-thumb">
                    </td>
                    <td th:text="${b.name}"></td>
                    <td th:text="${b.author}"></td>
                    <td>Rs. <span th:text="${b.price}"></span></td>

                    <td class="text-center">
                        <a class="text-danger delete-icon"
                           th:href="@{/deleteMyList/{id}(id=${b.id})}"
                           title="Remove from My Books">
                            <i class="fa-solid fa-trash fa-lg"></i>
                        </a>
                    </td>
                </tr>

                <!-- SHOW MESSAGE IF NO BOOKS -->
                <tr th:if="${#lists.isEmpty(books)}">
                    <td colspan="6" class="text-center text-muted">
                        You have not added any books yet.
                    </td>
                </tr>

                </tbody>
            </table>
        </div>

    </div>
</div>
</div>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-3">
    © 2026 Book Store | All Rights Reserved
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

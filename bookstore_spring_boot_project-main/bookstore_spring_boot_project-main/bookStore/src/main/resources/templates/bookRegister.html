<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.com">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <title>New Book Register</title>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f6f9;
        }

        .form-card {
            background: white;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,.1);
            padding: 40px 30px;
            transition: all 0.3s ease;
        }

        .form-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,.15);
        }

        .page-title {
            font-weight: 600;
            font-size: 1.75rem;
        }

        label {
            font-weight: 500;
        }

        .btn-primary {
            font-weight: 600;
        }

        input[type="file"] {
            padding: 5px 3px;
        }

        @media (max-width: 576px) {
            .form-card {
                padding: 30px 20px;
            }
        }
		
		.btn-yellow {
		    background-color: #FFD700;  /* gold/yellow */
		    border-color: #FFD700;
		    color: #000;               /* black text */
		    font-weight: 600;
		}

		.btn-yellow:hover {
		    background-color: #FFC107; /* darker yellow on hover */
		    border-color: #FFC107;
		    color: #000;
		}

		html, body {
		    height: 100%;
		    margin: 0;
		    display: flex;
		    flex-direction: column;
		}

		.page-container {
		    flex: 1;              /* Take up all remaining space */
		    display: flex;
		    flex-direction: column;
		}

		.content-wrap {
		    flex: 1;              /* Push footer to bottom if content is short */
		}

	


		
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"> Book Store</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="available_books">Available Books</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="my_books">My Books</a>
                </li>
            </ul>

            <a class="btn btn-warning fw-semibold" href="book_register">
                + New Book Register
            </a>
        </div>
    </div>
</nav>
<div class="content-wrap">
<!-- FORM SECTION -->
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">

            <div class="form-card">
                <h3 class="text-center page-title mb-4"> New Book Register</h3>

                <form th:action="@{/save}" method="post" enctype="multipart/form-data">

                    <div class="mb-3">
                        <label class="form-label">Book Name</label>
                        <input type="text" class="form-control" name="name"
                               placeholder="Enter book name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Author</label>
                        <input type="text" class="form-control" name="author"
                               placeholder="Enter author name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Price</label>
                        <input type="number" class="form-control" name="price"
                               placeholder="Enter price" required min="0" step="0.01">
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Book Image</label>
                        <input type="file" class="form-control" name="imageFile" accept="image/*" required>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-yellow btn-lg">
                            Save Book
                        </button>
                    </div>

                </form>
            </div>

        </div>
    </div>
</div>
</div>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-3">
    © 2026 Book Store | All Rights Reserved
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
